services:
  - type: web
    name: mlimiconnect-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mlimiconnect-db
          property: connectionString
      - key: PAYMENTS_ENABLED
        sync: false
      - key: PAYMENT_PROVIDER
        value: paychangu
      - key: PAYMENT_MODE
        value: test
      - key: PAYMENT_CURRENCY
        value: MWK
      - key: PAYCHANGU_PUBLIC_KEY
        sync: false
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: WEATHER_API_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: WEATHER_TIMEOUT_SECONDS
        value: "8"
      - key: MEDIA_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_TIMEOUT_SECONDS
        value: "8"
      - key: EMAIL_PROVIDER
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SMS_ENABLED
        sync: false
      - key: SMS_PROVIDER
        value: textbee
      - key: TEXTBEE_API_URL
        value: https://api.textbee.dev/api/v1
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: SMS_SENDER_NUMBER
        sync: false
      - key: DIAGNOSIS_PROVIDER
        value: kindwise
      - key: KINDWISE_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: USSD_SERVICE_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: SENTRY_ERROR_SAMPLE_RATE
        value: "1"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: mlimiconnect-db
    plan: free
    databaseName: mlimiconnect
    user: mlimiconnect
