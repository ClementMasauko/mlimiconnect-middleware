name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mlimiconnect
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mlimiconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlimiconnect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mlimiconnect:test-password@127.0.0.1:5432/mlimiconnect_test
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-safe-characters-2026
      DJANGO_DEBUG: "false"
      MEDIA_STORAGE_PROVIDER: filesystem
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      OUTBOX_INLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
      - run: python manage.py spectacular --urlconf config.schema_urls --validate --fail-on-warn --file openapi-ci.yaml
      - run: python manage.py test --verbosity 1
