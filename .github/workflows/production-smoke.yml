name: Production smoke check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API readiness
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          test -n "$API_HEALTH_URL"
          curl --fail --show-error --silent --retry 2 --max-time 30 "$API_HEALTH_URL" | tee health.json
          python -c 'import json; data=json.load(open("health.json")); assert data["status"] == "ready"; assert data["checks"]["database"] == "ok"'
      - name: Check public frontend
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          test -n "$FRONTEND_URL"
          curl --fail --show-error --silent --retry 2 --max-time 30 --output /dev/null "$FRONTEND_URL"
